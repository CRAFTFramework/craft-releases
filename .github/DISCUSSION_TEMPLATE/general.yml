title: "[share] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Welcome! Questions, ideas, and "how did it go" stories all belong here. No question is too basic.
  - type: textarea
    id: topic
    attributes:
      label: What's on your mind?
      description: Ask a question, share feedback, or show what you built.
      placeholder: e.g. "I'm new to CRAFT and tried the June release — here's what happened…"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Which release (if any)?
      placeholder: craft-for-claude-cowork-v.b0001.p202606.01b
    validations:
      required: false
