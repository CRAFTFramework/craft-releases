name: CRAFT Author Identity & Signature Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The canonical ANCHOR is the email + GPG key (the cryptographic trust root,
  # CD-042 §8.2). The author DISPLAY NAME is cosmetic: GitKraken commits author
  # as "Richard Ketelsen", GitHub-web commits as "CRAFT Framework" — same email,
  # same key. So we ENFORCE the email and WARN-not-fail on names outside the
  # allowlist. (H137 Richard-ratified amendment to DR-5/DR-6.)
  CANONICAL_EMAIL: "richard@craftframework.ai"
  ALLOWED_NAMES: "Richard Ketelsen|CRAFT Framework"

jobs:
  author-identity:
    name: Enforce canonical author email (warn on display name)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the pushed range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            # New branch / first push: fall back to checking just the tip commit.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="${{ github.sha }}~1"
            fi
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce canonical email; warn on display name
        run: |
          BASE="${{ steps.range.outputs.base }}"
          HEAD="${{ steps.range.outputs.head }}"
          echo "Checking authorship for range ${BASE}..${HEAD}"
          BAD=0
          while IFS='|' read -r sha aname aemail; do
            [ -z "$sha" ] && continue
            if [ "$aemail" != "$CANONICAL_EMAIL" ]; then
              echo "::error::Commit $sha author email '$aemail' is not the canonical '$CANONICAL_EMAIL'"
              BAD=$((BAD + 1))
            elif ! printf '%s' "$aname" | grep -qxE "$ALLOWED_NAMES"; then
              echo "::warning::Commit $sha display name '$aname' not in allowlist (email OK). Allowed: $ALLOWED_NAMES"
            else
              echo "OK: $sha  $aname <$aemail>"
            fi
          done < <(git log --format='%H|%an|%ae' "${BASE}..${HEAD}")
          if [ "$BAD" -gt 0 ]; then
            echo ""
            echo "FAIL: $BAD commit(s) use a non-canonical author email (SP25 operating principle 8 / CD-042 §8.2)."
            exit 1
          fi
          echo "All commits in range carry the canonical author email."

  signature:
    name: Verify commit signatures (WARN until public key wired — Phase 4)
    runs-on: ubuntu-latest
    continue-on-error: true   # flip to false at Phase 4 LOCK once the public key is importable in CI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report signature status per commit
        run: |
          # %G?: G=good, U=good-untrusted, E=cannot-check(missing key), B=bad, N=none
          git log --format='%H %G? %an <%ae>' -20 | while read -r sha gstat rest; do
            case "$gstat" in
              G|U) echo "SIGNED: $sha ($gstat) $rest" ;;
              N)   echo "::warning::UNSIGNED commit $sha $rest" ;;
              B)   echo "::error::BAD signature on $sha $rest" ;;
              *)   echo "::warning::Signature uncheckable ($gstat) on $sha — public key not present in CI $rest" ;;
            esac
          done
