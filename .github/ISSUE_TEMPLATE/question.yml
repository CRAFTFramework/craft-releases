name: "❓ Question"
description: "Ask about a release, a channel, or how verification works."
title: "[question] <short summary>"
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Most questions are a better fit for [Discussions → Q&A](../../discussions/categories/q-a)**,
        where others can answer and the thread stays searchable. Use this form only
        if you'd rather track it as an issue.
  - type: input
    id: release_version
    attributes:
      label: Release-version (if your question is about a specific release)
      placeholder: "cowork/v1.0.0  (leave blank if general)"
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: "What would you like to know?"
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: "I checked VERIFY.md / the README and didn't find the answer"
          required: false
        - label: "I searched existing Discussions and Issues"
          required: false
